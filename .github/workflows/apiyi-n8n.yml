name: APIYI n8n package

on:
  pull_request:
    paths:
      - 'experiments/apiyi-n8n/**'
      - '.github/workflows/apiyi-n8n.yml'
  push:
    branches:
      - 'experiment/apiyi-n8n-bounty'
    paths:
      - 'experiments/apiyi-n8n/**'
      - '.github/workflows/apiyi-n8n.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/apiyi-n8n
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/apiyi-n8n/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run lint
      - run: npm run build
