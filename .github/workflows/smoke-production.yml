name: Verify private production access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify anonymous access is blocked
        shell: bash
        run: |
          set -euo pipefail
          base='https://wealth-engine-production-e178.up.railway.app'
          curl --fail --silent --show-error --max-time 15 "$base/health" -o health.json
          node -e "const x=require('./health.json');if(x.mode!=='private'||x.usage||x.liveSignalSources)process.exit(1)"
          for path in / /api/opportunities /api/live-scan /api/voice-margin-index /usage /.well-known/agent-capabilities.json; do
            status=$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "$base$path")
            test "$status" = '401'
          done
          status=$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$base/mcp")
          test "$status" = '401'
          echo 'Anonymous access is blocked; no opportunity data was logged.'
