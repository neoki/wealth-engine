name: Validate Convenio Watch

on:
  push:
    paths:
      - '.github/workflows/validate-convenio-watch.yml'
      - 'validation/convenio-watch-*.mjs'
      - 'validation/convenio-watch-*.json'
      - 'validation/run-convenio-watch-*.mjs'
      - 'package.json'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:convenio-model
      - run: npm run check:convenio-lifecycle
      - run: npm run check:convenio-deadline
      - run: npm run check:convenio-portfolio
      - run: npm run check:convenio-template
      - run: npm run check:convenio-real-portfolio
      - run: npm run check:convenio-e2e
      - run: npm run check:convenio-batch
      - run: npm run check:convenio-implementation
      - run: npm run check:convenio
